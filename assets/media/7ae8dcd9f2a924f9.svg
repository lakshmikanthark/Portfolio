<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900"><defs><radialGradient id="g"><stop stop-color="#16253f"/><stop offset="1" stop-color="#05070a"/></radialGradient></defs><rect width="1400" height="900" fill="url(#g)"/><text x="80" y="95" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#f7f8fa">● Demand Forecast</text><text x="700" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#b7c9ff" letter-spacing="5">DEMAND FORECASTING FOR REAL BUSINESSES</text><g text-anchor="middle" font-family="Arial,sans-serif" font-size="100" font-weight="700" letter-spacing="-5"><text x="700" y="380" fill="#f7f8fa">Forecast demand.</text><text x="700" y="475" fill="#cdd8eb">Not guesswork.</text></g><text x="700" y="550" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#c5cbd5">Bring your daily sales history. Get a clearer demand outlook.</text><rect x="185" y="620" width="500" height="150" rx="20" fill="#111c30" stroke="#47669b"/><rect x="715" y="620" width="500" height="150" rx="20" fill="#0b0f14" stroke="#333a45"/><g font-family="Arial,sans-serif" font-size="28" fill="#f7f8fa"><text x="220" y="680">I already have data</text><text x="750" y="680">Help me create a dataset</text></g><g font-family="Arial,sans-serif" font-size="18" fill="#9aa3b2"><text x="220" y="725">Upload a CSV and check it.</text><text x="750" y="725">Learn what to collect.</text></g></svg>